name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.286
      - name: Validate the plugin manifest and hooks
        run: claude plugin validate .claude-plugin/plugin.json --strict
      - name: Validate the marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict
      - name: Run the plugin tests
        run: claude plugin test .
      - name: Check the install, uninstall and benchmark scripts parse
        run: |
          bash -n scripts/installation/unix/install.sh
          bash -n scripts/installation/unix/uninstall.sh
          pwsh -NoProfile -Command '
            $failed = $false
            foreach ($file in "scripts/installation/windows/install.ps1", "scripts/installation/windows/uninstall.ps1", "scripts/benchmarking/headless.ps1", "scripts/benchmarking/inapp.ps1") {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
              foreach ($e in $errors) { Write-Host "${file}: $($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
            }
            if ($failed) { exit 1 }'
      - name: Check the README terminal rows match the builder
        run: node design/readme/rows.mjs --check
      - name: Check the README option pictures match the builder and drawings
        run: node design/readme/options.mjs --check
