name: Release

# Publishes the GitHub release of every version tag, with the CHANGELOG.md section of that
# version as its notes, so the file and the Releases page stay in sync. The changelog and the
# version bump stay manual, in the pull request they release (docs/development.md, "Releasing");
# tag-release.yml creates the vX.Y.Z tag when the release lands on master and calls this workflow
# for it (a tag pushed by GITHUB_TOKEN starts no workflow of its own). A v* tag pushed by hand runs
# it too, and creating the release in the GitHub UI first also works: this run then only brings the
# notes up to date with the changelog.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to release
        required: true
        type: string
  # Manual runs check the manifests and print the notes the current changelog would publish;
  # nothing is released. Useful before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    env:
      # The tag: the caller's input, else the tag this run was started by.
      TAG: ${{ inputs.tag || github.ref_name }}
      IS_TAG: ${{ inputs.tag != '' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag against the manifests
        shell: pwsh
        run: |
          # The marketplace installs the version plugin.json names, so a tag must match it,
          # and the marketplace entry must agree.
          $plugin = (Get-Content -Raw "$env:GITHUB_WORKSPACE/.claude-plugin/plugin.json" | ConvertFrom-Json).version
          $market = ((Get-Content -Raw "$env:GITHUB_WORKSPACE/.claude-plugin/marketplace.json" | ConvertFrom-Json).plugins | Where-Object name -eq 'neonmeter').version
          if ($plugin -ne $market) { Write-Error "plugin.json is $plugin but marketplace.json is $market"; exit 1 }
          if ($env:IS_TAG -eq "true") {
            $version = $env:TAG.TrimStart("v")
            if ($version -ne $plugin) { Write-Error "tag $env:TAG does not match plugin.json version $plugin"; exit 1 }
          }
          "version $plugin"

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # The release body is the CHANGELOG.md section matching the version. Falls back to a
          # changelog pointer when no section matches (e.g. a release-candidate tag).
          $version = if ($env:IS_TAG -eq "true") { $env:TAG.TrimStart("v") }
            else { (Get-Content -Raw "$env:GITHUB_WORKSPACE/.claude-plugin/plugin.json" | ConvertFrom-Json).version }
          $changelog = Get-Content -Path "$env:GITHUB_WORKSPACE/CHANGELOG.md" -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
          $notes = if ($changelog -match $pattern) { $matches[1].Trim() }
          else { "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)." }
          Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value $notes
          Get-Content -Path "$env:RUNNER_TEMP/release-notes.md"

      - name: Create or update the release
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo "${{ github.repository }}" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          }
          else {
            gh release create $tag --repo "${{ github.repository }}" `
              --title "NeonMeter $($tag.TrimStart('v'))" --notes-file "$env:RUNNER_TEMP/release-notes.md" --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
