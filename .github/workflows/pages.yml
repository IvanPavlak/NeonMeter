name: pages

# Builds the documentation site (docs/, with the pictures from design/readme/) with Jekyll and the Just the
# Docs theme, as _config.yml sets it up. A pull request only builds it, so a broken page fails there; a push
# to master, or a manual run, also publishes it with GitHub Pages (Settings, Pages, Source: GitHub Actions).

on:
  push:
    branches: [master]
    paths: ['docs/**', 'design/readme/**', '_config.yml', 'index.html', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'design/readme/**', '_config.yml', 'index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
